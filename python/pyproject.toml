[project]
name = "hs-verify"
version = "0.1.0"
description = "Keyless verification of Hunter-Seeker Verdicts (Ed25519 detached JWS over RFC 8785 JCS)."
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]
license = {text = "Apache-2.0"}
readme = "../README.md"

[project.urls]
Homepage = "https://hunter-seeker.net/for-agents"
Source = "https://github.com/hunter-seeker/hunter-seeker-verify"
JWKS = "https://hunter-seeker.net/.well-known/jwks.json"

[project.scripts]
hs-verify = "hs_verify:main"

[tool.pytest.ini_options]
pythonpath = ["."]
